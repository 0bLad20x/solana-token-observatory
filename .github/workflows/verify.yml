name: Verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-verification:
    name: Python verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q src tools

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Verify lifecycle contract
        run: python tools/verify_lifecycle_contract_v01.py

      - name: Verify CLI entry points
        run: |
          python src/main.py --help
          python src/lifecycle_clean.py --help

  frontend-contracts:
    name: Frontend contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run frontend contract tests
        run: node --test tests/*.mjs
